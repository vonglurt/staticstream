[package]
name = "staticstream-ytq"
description = "ytq, the download queue that watches the clipboard, in Rust: its queue, settings and downloads, archiving to Static Stream"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

# The binary `ytq` is built from step 2e of docs/phase-2.md, and was not built
# before it: ~/.local/bin, where make install and copal-build put what this
# workspace builds, comes before /usr/local/bin on Copal's PATH, so an
# unfinished `ytq` here would have shadowed the working Python one on every
# node. It does everything the Python ytq did now, and that one is retired.
#
# The crate stays a library too: `sstr ytq` runs the same `cli::main`, so the
# command and the binary cannot drift apart.

[[bin]]
name = "ytq"
path = "src/main.rs"

[dependencies]
staticstream = { path = "../staticstream" }
