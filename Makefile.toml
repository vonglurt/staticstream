#
# The release matrix, for `make dist` (cargo make dist). Only this needs more
# than cargo:
#
#   cargo-zigbuild      zig as the linker -- make tools
#   a standard library  for each target: rustup target add aarch64-unknown-linux-musl
#                       armv7-unknown-linux-musleabihf x86_64-unknown-linux-musl
#
# Alpine's rust package ships only its own target's standard library, so on
# the guest without rustup the build that works is the native one, make build.
# Every Copal machine can build its own that way; this is for building them
# all from one.

[config]
skip_core_tasks = true

[tasks.preflight]
script = '''
command -v cargo-zigbuild >/dev/null 2>&1 || { echo "error: no cargo-zigbuild -- make tools"; exit 1; }
command -v rustup >/dev/null 2>&1 || { echo "error: no rustup -- a cross build needs its standard library for each target"; exit 1; }
'''

[tasks.dist-aarch64]
dependencies = ["preflight"]
script = '''
cargo zigbuild --release --target aarch64-unknown-linux-musl
mkdir -p dist/aarch64-unknown-linux-musl
cp target/aarch64-unknown-linux-musl/release/sstr target/aarch64-unknown-linux-musl/release/sstr-workspace target/aarch64-unknown-linux-musl/release/ytq dist/aarch64-unknown-linux-musl/
'''

[tasks.dist-armv7]
dependencies = ["preflight"]
script = '''
cargo zigbuild --release --target armv7-unknown-linux-musleabihf
mkdir -p dist/armv7-unknown-linux-musleabihf
cp target/armv7-unknown-linux-musleabihf/release/sstr target/armv7-unknown-linux-musleabihf/release/sstr-workspace target/armv7-unknown-linux-musleabihf/release/ytq dist/armv7-unknown-linux-musleabihf/
'''

[tasks.dist-x86_64]
dependencies = ["preflight"]
script = '''
cargo zigbuild --release --target x86_64-unknown-linux-musl
mkdir -p dist/x86_64-unknown-linux-musl
cp target/x86_64-unknown-linux-musl/release/sstr target/x86_64-unknown-linux-musl/release/sstr-workspace target/x86_64-unknown-linux-musl/release/ytq dist/x86_64-unknown-linux-musl/
'''

[tasks.dist]
dependencies = ["dist-aarch64", "dist-armv7", "dist-x86_64"]
